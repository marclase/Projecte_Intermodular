site_name: Programació en Java per a principiants
site_description: Guia senzilla per a començar a programar en Java (Projecte Intermodular, SMX)
site_author: Marc Ortiz
site_url: https://marclase.github.io/Projecte_Intermodular/
repo_url: https://github.com/marclase/Projecte_Intermodular
repo_name: marclase/Projecte_Intermodular

theme:
  name: material
  language: ca
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Mode fosc
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Mode clar
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - attr_list
  - toc:
      permalink: true

nav:
  - Inici: index.md
  - Introducció:
      - Què és Java?: introduccio/que-es-java.md
      - El primer programa: introduccio/primer-programa.md
  - Conceptes bàsics:
      - Variables i dades: conceptes/variables.md
      - Condicionals i bucles: conceptes/condicionals-bucles.md
  - Referències: referencies.md
